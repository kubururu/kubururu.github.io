<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kuburu.fyi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --card-bg: #151515; 
            --btn-bg: #631717;
            --btn-hover: #801d1d;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: url('bg.gif') center/cover no-repeat fixed;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 25%; 
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            opacity: 0.9;
        }

        .profile-pic {
            width: 80%; 
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            color: var(--text-main);
            font-size: 45px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .social-links {
            display: flex;
            gap: 20px;
            margin: 12px 0 25px 0;
        }

        .social-links a {
            color: var(--text-main);
            font-size: 40px;
            transition: color 0.2s;
            text-decoration: none;
        }

        .social-links a:hover {
            color: var(--text-sub);
        }

        .link-btn {
            display: flex;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: var(--btn-bg);
            padding: 20px 28px;
            border-radius: 25px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 20px;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: transform 0.2s, background-color 0.2s;
        }

        .link-btn:hover {
            background-color: var(--btn-hover);
            transform: scale(1.02);
        }

        .link-btn i {
            font-size: 20px;
            width: 30px;
        }

        .link-text {
            flex-grow: 1;
            text-align: center;
            padding-right: 30px;
        }

        .embed-container {
            width: 100%;
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        iframe {
            border: none;
            width: 100%;
            display: block;
        }

        @media (max-width: 1200px) {
            .container {
                max-width: 450px;
            }
        }

        /* Telefony */
        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }
            .container {
                max-width: 100%;
                padding: 25px 15px;
            }
            h1 {
                font-size: 36px;
            }
            .social-links {
                gap: 15px;
            }
            .social-links a {
                font-size: 32px;
            }
            .link-btn {
                padding: 16px 20px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="avatar.gif" alt="kuburu" class="profile-pic">
        
        <h1>kuburu</h1>
        
        <div class="social-links">
            <a href="https://x.com/kubururu" target="_blank"><i class="fa-brands fa-twitter"></i></a>
            <a href="https://www.instagram.com/kubururu/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://github.com/kubururu" target="_blank"><i class="fa-brands fa-github"></i></a>
            <a href="https://www.youtube.com/@kuburu" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            <a href="discord://-/users/295252007948779530"><i class="fa-brands fa-discord"></i></a>
        </div>

        <a href="/deadlock-draft" class="link-btn">
            <span class="link-text">Deadlock Draft</span>
        </a>

        <div class="embed-container" style="aspect-ratio: 16/9;">
            <iframe src="https://www.youtube.com/embed/StjW_iuFln4" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="height: 100%;"></iframe>
        </div>

        <div class="embed-container">
            <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/0MUQtVlIkuMeDfZFm5xKRq?utm_source=generator&si=1af70c2679dc44fe" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
    </div>

</body>
</html>
